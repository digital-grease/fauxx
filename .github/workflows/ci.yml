name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # full is the only build flavor (F-Droid / GitHub releases). The single-entry
          # matrix keeps the check name "Build & Test (full)" stable.
          - flavor: full
            flavorName: Full

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Robolectric downloads its Android runtime jars (android-all-instrumented, about 500 MB for
      # the SDK levels the tests use) from Maven Central into ~/.m2 at test time, outside the
      # Gradle cache. Fetched twice per run (here and in the coverage job), they got runners
      # rate-limited: HTTP 429s and failed downloads that failed every Robolectric test class.
      # The key changes only with the Robolectric version or the SDK levels the tests ask for.
      - name: Robolectric cache key
        id: robolectric
        run: |
          version=$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          sdks=$( { grep -rhoE 'sdk = \[[0-9, ]+\]' app/src/test || true; grep -hE '^\s*(compileSdk|targetSdk) =' app/build.gradle.kts; } | sort -u | sha256sum | cut -c1-12)
          echo "key=robolectric-${version}-${sdks}" >> "$GITHUB_OUTPUT"

      - name: Cache Robolectric's Android runtime jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}
          restore-keys: robolectric-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test${{ matrix.flavorName }}DebugUnitTest

      - name: Coverage gate (ratcheting)
        run: ./gradlew koverVerifyFullDebug

      - name: Android Lint
        run: ./gradlew lint${{ matrix.flavorName }}Debug

      - name: Build debug APK
        run: ./gradlew assemble${{ matrix.flavorName }}Debug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.flavor }}
          path: app/build/reports/tests/

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results-${{ matrix.flavor }}
          path: app/build/reports/lint-results-*.html

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-${{ matrix.flavor }}
          path: app/build/outputs/apk/${{ matrix.flavor }}/debug/app-${{ matrix.flavor }}-debug.apk

  # Posts (and updates in place) a coverage summary on each PR. The hard gate is
  # koverVerifyFullDebug in the build job above; this is just the at-a-glance number so a
  # reviewer sees where a change moves coverage without opening the report artifact.
  coverage-comment:
    name: Coverage comment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # The same Robolectric cache as the build job (see there): this job runs the tests too.
      - name: Robolectric cache key
        id: robolectric
        run: |
          version=$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          sdks=$( { grep -rhoE 'sdk = \[[0-9, ]+\]' app/src/test || true; grep -hE '^\s*(compileSdk|targetSdk) =' app/build.gradle.kts; } | sort -u | sha256sum | cut -c1-12)
          echo "key=robolectric-${version}-${sdks}" >> "$GITHUB_OUTPUT"

      - name: Cache Robolectric's Android runtime jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}
          restore-keys: robolectric-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate coverage XML
        run: ./gradlew koverXmlReportFullDebug

      - name: Extract line coverage
        id: cov
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          root = ET.parse("app/build/reports/kover/reportFullDebug.xml").getroot()
          line = [c for c in root.findall("counter") if c.get("type") == "LINE"][0]
          covered = int(line.get("covered"))
          total = covered + int(line.get("missed"))
          pct = (100.0 * covered / total) if total else 0.0
          print(f"pct={pct:.2f}")
          print(f"covered={covered}")
          print(f"total={total}")
          # Read the ratchet floor from the baseline file so the comment can never go
          # stale against the real gate (it previously hardcoded an outdated number).
          with open("app/kover-baseline.properties") as f:
              for raw in f:
                  if raw.strip().startswith("line.coverage.min="):
                      print(f"floor={raw.strip().split('=', 1)[1]}")
                      break
              else:
                  raise SystemExit("line.coverage.min not found in kover-baseline.properties")
          PY

      - name: Post sticky coverage comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage-fulldebug
          message: |
            ### 📊 Code coverage (fullDebug)

            **${{ steps.cov.outputs.pct }}%** line coverage — ${{ steps.cov.outputs.covered }} / ${{ steps.cov.outputs.total }} lines covered · ratchet floor **${{ steps.cov.outputs.floor }}%**

            Hard-gated by `koverVerifyFullDebug`. Raise `app/kover-baseline.properties` as coverage grows. Generated code and Compose UI screens are excluded from the measurement.
